<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice lab</title>
    <!-- Throwaway spike for hands-free study (see the hands-free plan): can Chrome on
     this phone recognise the quiz commands, on-device or not, and how fast. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --ok: #15803d;
        --bad: #b91c1c;
        --accent: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --ok: #4ade80;
          --bad: #f87171;
          --accent: #f87171;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
      }
      p {
        margin: 4px 0;
        color: var(--muted);
      }
      section {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.main {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
      }
      #step {
        color: var(--muted);
        min-height: 1.4rem;
      }
      #prompt {
        font-size: 2.6rem;
        font-weight: 700;
        line-height: 1.15;
        min-height: 3.2rem;
        margin: 8px 0;
      }
      #status {
        font-size: 1.1rem;
        min-height: 1.6rem;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      ol {
        padding-left: 20px;
        margin: 0;
        font-size: 0.9rem;
      }
      li {
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      small {
        color: var(--muted);
      }
      code {
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voice lab</h1>
      <p>Start the test, then say each word on screen after the beep. It moves on by itself.</p>

      <section>
        <div id="support"></div>
        <label
          ><input type="checkbox" id="local" /> On the phone only
          (<code>processLocally</code>)</label
        >
        <div class="row"><button id="install" hidden>Download the speech model</button></div>
      </section>

      <section>
        <div class="row">
          <button class="main" id="start">Start test</button>
          <button id="once">Say anything</button>
        </div>
        <div id="step"></div>
        <div id="prompt"></div>
        <div id="status"></div>
      </section>

      <section>
        <div class="row">
          <strong>Results</strong> <span id="score"></span> <button id="copy">Copy</button>
        </div>
        <ol id="log"></ol>
      </section>
    </main>
    <script>
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = (id) => document.getElementById(id);
      const lang = "en-CA";
      const options = ["Louis Riel", "John A. Macdonald", "Samuel de Champlain", "Laura Secord"];

      // What to say, and the command the app should hear. Letters come twice, in a
      // different order, because B/D and C/"see" are the likely confusions.
      const prompts = [
        ["A", "A"],
        ["B", "B"],
        ["C", "C"],
        ["D", "D"],
        ["True", "true"],
        ["False", "false"],
        ["Repeat", "repeat"],
        ["Next", "next"],
        ["Why", "why"],
        ["I don't know", "skip"],
        ["Louis Riel", "answer: Louis Riel"],
        ["D", "D"],
        ["B", "B"],
        ["Pause", "pause"],
        ["C", "C"],
        ["A", "A"],
        ["Laura Secord", "answer: Laura Secord"],
        ["What can I say", "help"],
        ["Continue", "next"],
        ["Samuel de Champlain", "answer: Samuel de Champlain"],
      ];

      const commands = [
        ["A", /^(a|ay|eh|hey|option a|letter a)$/],
        ["B", /^(b|be|bee|option b|letter b)$/],
        ["C", /^(c|see|sea|si|option c|letter c)$/],
        ["D", /^(d|dee|option d|letter d)$/],
        ["true", /^(true|that's true|it's true)$/],
        ["false", /^(false|that's false|it's false)$/],
        ["repeat", /^(repeat|again|say (it|that) again)$/],
        ["next", /^(next|continue|go on|okay|ok)$/],
        ["pause", /^(pause|stop|wait)$/],
        ["resume", /^(resume|go|start)$/],
        ["why", /^(why|explain|how come)$/],
        ["skip", /^(i don't know|don't know|i dont know|no idea|skip|pass)$/],
        ["help", /^(what can i say|help)$/],
      ];
      const clean = (s) =>
        s
          .toLowerCase()
          .replace(/[.,!?]/g, "")
          .trim();
      function match(alternatives) {
        for (const alt of alternatives) {
          const said = clean(alt);
          for (const [name, pattern] of commands) if (pattern.test(said)) return name;
          const option = options.find((o) =>
            clean(o)
              .split(" ")
              .some((w) => w.length > 3 && said.includes(w)),
          );
          if (option) return `answer: ${option}`;
        }
        return null;
      }

      async function checkSupport() {
        if (!Recognition) {
          $("support").innerHTML =
            '<span class="bad">No speech recognition in this browser.</span>';
          return;
        }
        const parts = ['Recognition: <span class="ok">yes</span>'];
        if (Recognition.available) {
          const state = await Recognition.available({ langs: [lang], processLocally: true });
          parts.push(`On-device for ${lang}: <strong>${state}</strong>`);
          $("install").hidden = state !== "downloadable";
          $("local").checked = state === "available";
        } else {
          parts.push('On-device check: <span class="bad">not offered by this Chrome</span>');
          $("local").disabled = true;
        }
        $("support").innerHTML = parts.join("<br>");
      }

      $("install").onclick = async () => {
        $("install").disabled = true;
        $("install").textContent = "Downloading...";
        const ok = await Recognition.install({ langs: [lang], processLocally: true });
        $("install").textContent = ok ? "Downloaded" : "Download failed";
        checkSupport();
      };

      let audio;
      function beep() {
        audio ??= new AudioContext();
        const osc = audio.createOscillator(),
          gain = audio.createGain();
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.15);
        return new Promise((r) => setTimeout(r, 250));
      }

      function listen() {
        return new Promise((resolve) => {
          const r = new Recognition();
          r.lang = lang;
          r.maxAlternatives = 5;
          r.interimResults = false;
          r.continuous = false;
          if ($("local").checked) r.processLocally = true;
          let speechEnd = null,
            done = false;
          const finish = (value) => {
            if (!done) {
              done = true;
              resolve(value);
            }
          };
          r.onspeechend = () => {
            speechEnd = performance.now();
          };
          r.onresult = (e) =>
            finish({
              heard: [...e.results[0]].map((a) => a.transcript),
              wait: speechEnd ? Math.round(performance.now() - speechEnd) : null,
            });
          r.onerror = (e) => finish({ error: e.error });
          r.onend = () => finish({ error: "nothing heard" });
          r.start();
        });
      }

      const results = [];
      function record(entry) {
        results.push(entry);
        const li = document.createElement("li");
        const verdict = entry.expected
          ? entry.command === entry.expected
            ? '<strong class="ok">✓</strong>'
            : '<strong class="bad">✗</strong>'
          : `<strong>${entry.command ?? "no match"}</strong>`;
        const said = entry.error
          ? `<span class="bad">${entry.error}</span>`
          : `"${entry.heard[0]}"`;
        const others =
          entry.heard?.length > 1
            ? ` <small>(also ${entry.heard
                .slice(1)
                .map((h) => `"${h}"`)
                .join(", ")})</small>`
            : "";
        li.innerHTML = `${verdict} ${entry.say ? `<b>${entry.say}</b> → ` : ""}${said}${others} <small>· ${entry.wait ?? "?"} ms${entry.local ? " · on-device" : ""}</small>`;
        $("log").prepend(li);
        const graded = results.filter((r) => r.expected);
        const right = graded.filter((r) => r.command === r.expected).length;
        const waits = results
          .map((r) => r.wait)
          .filter(Boolean)
          .sort((a, b) => a - b);
        $("score").textContent =
          `${graded.length ? `${right} of ${graded.length} right` : ""}${waits.length ? ` · typical wait ${waits[Math.floor(waits.length / 2)]} ms` : ""}`;
      }

      async function attempt(say, expected) {
        $("status").textContent = "Listening...";
        await beep();
        const result = await listen();
        const command = result.heard ? match(result.heard) : null;
        const entry = { say, expected, ...result, command, local: $("local").checked };
        record(entry);
        $("status").innerHTML = result.error
          ? `<span class="bad">${result.error}</span>`
          : `<span class="${!expected || command === expected ? "ok" : "bad"}">Heard "${result.heard[0]}"${command ? ` = ${command}` : ""}</span>`;
      }

      let running = false,
        wakeLock = null;
      function setRunning(on) {
        running = on;
        $("start").textContent = on ? "Stop" : "Start test";
        $("once").disabled = on;
        if (!on) {
          wakeLock?.release();
          wakeLock = null;
          $("step").textContent = "";
          $("prompt").textContent = "";
        }
      }
      $("start").onclick = async () => {
        if (running) return setRunning(false);
        setRunning(true);
        try {
          wakeLock = await navigator.wakeLock?.request("screen");
        } catch {}
        for (const [i, [say, expected]] of prompts.entries()) {
          if (!running) return;
          $("step").textContent = `${i + 1} of ${prompts.length}. Say:`;
          $("prompt").textContent = say;
          await new Promise((r) => setTimeout(r, 600));
          if (!running) return;
          await attempt(say, expected);
          await new Promise((r) => setTimeout(r, 900));
        }
        setRunning(false);
        $("status").textContent = "Done. Tap Copy and paste the results.";
      };

      $("once").onclick = async () => {
        $("once").disabled = true;
        $("prompt").textContent = "Say anything";
        await attempt(null, null);
        $("prompt").textContent = "";
        $("once").disabled = false;
      };

      $("copy").onclick = () =>
        navigator.clipboard
          .writeText(
            JSON.stringify({
              ua: navigator.userAgent,
              results: results.map(({ say, heard, error, command, wait, local }) => ({
                say,
                heard,
                error,
                command,
                wait,
                local,
              })),
            }),
          )
          .then(() => {
            $("copy").textContent = "Copied";
          });

      checkSupport();
    </script>
  </body>
</html>
