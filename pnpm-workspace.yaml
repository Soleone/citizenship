catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Transformers.js pulls these in for Node; the app only runs it in the browser.
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
